<div class="modal-backdrop" data-cy="modal-content" (click)="closeModal.emit()">
  <dialog open class="modal-content" (click)="$event.stopPropagation()">
    <div class="modal-header">
      <h2>Editar Publicação</h2>
      <button class="btn-close" (click)="closeModal.emit()">✕</button>
    </div>

    <form [formRoot]="editForm">
      <div class="form-group">
        <label for="edit-title">Título do Post</label>
        <input
          type="text"
          id="edit-title"
          [formField]="editForm.title"
          [class.invalid]="editForm.title().touched() && editForm.title().invalid()"
        />
        @if (editForm.title().touched() && editForm.title().invalid()) {
        <small class="error-message">O título deve ter no mínimo 5 caracteres.</small>
        }
      </div>

      <div class="form-group">
        <label for="edit-body">Conteúdo</label>
        <textarea
          id="edit-body"
          [formField]="editForm.body"
          rows="5"
          [class.invalid]="editForm.body().touched() && editForm.body().invalid()"
        ></textarea>
        @if (editForm.body().touched() && editForm.body().invalid()) {
        <small class="error-message">O conteúdo não pode ficar vazio.</small>
        }
      </div>

      <div class="modal-actions" data-cy="modal-actions">
        <button type="button" class="btn-cancel" (click)="closeModal.emit()">Cancelar</button>
        <button
          type="submit"
          data-cy="btn-submit"
          class="btn-submit"
          [disabled]="editForm().invalid() || isSaving()"
        >
          {{ isSaving() ? 'Salvando...' : 'Salvar Alterações' }}
        </button>
      </div>
    </form>
  </dialog>
</div>
